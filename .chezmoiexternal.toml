# External dependencies managed by chezmoi
# These are cloned/updated automatically on `chezmoi apply`

[".config/zsh/oh-my-zsh-custom/plugins/zsh-autosuggestions"]
    type = "git-repo"
    url = "https://github.com/zsh-users/zsh-autosuggestions.git"
    refreshPeriod = "168h"  # check for updates weekly

[".config/zsh/oh-my-zsh-custom/plugins/zsh-syntax-highlighting"]
    type = "git-repo"
    url = "https://github.com/zsh-users/zsh-syntax-highlighting.git"
    refreshPeriod = "168h"

[".config/zsh/oh-my-zsh-custom/plugins/zsh-vi-mode"]
    type = "git-repo"
    url = "https://github.com/jeffreytse/zsh-vi-mode.git"
    refreshPeriod = "168h"

# fabric — AI augmentation CLI (https://github.com/danielmiessler/fabric)
# archive-file extracts a single file from the release tarball; "latest"
# always resolves to the newest GitHub release, so weekly refresh = auto-update.
[".local/bin/fabric"]
    type = "archive-file"
    url = "https://github.com/danielmiessler/fabric/releases/latest/download/fabric_Linux_x86_64.tar.gz"
    path = "fabric"
    executable = true
    refreshPeriod = "168h"  # check for new release weekly
